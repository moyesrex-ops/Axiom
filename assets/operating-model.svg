<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AXIOM Operating Model</title>
  <desc id="desc">Three-tier overview showing AXIOM core runtime, optional sidecars, and experimental paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1520"/>
      <stop offset="100%" stop-color="#122538"/>
    </linearGradient>
    <linearGradient id="coreCard" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#142c3d"/>
      <stop offset="100%" stop-color="#102131"/>
    </linearGradient>
    <linearGradient id="optCard" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#253222"/>
      <stop offset="100%" stop-color="#1b291c"/>
    </linearGradient>
    <linearGradient id="expCard" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#342824"/>
      <stop offset="100%" stop-color="#241a18"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#03111a" flood-opacity="0.42"/>
    </filter>
    <style>
      .title { font: 700 40px 'Segoe UI', Arial, sans-serif; fill: #f4fbff; }
      .subtitle { font: 400 19px 'Segoe UI', Arial, sans-serif; fill: #bfd2df; }
      .h { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #f7fbff; }
      .k { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #ebf7ff; }
      .p { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #d6e5ef; }
      .small { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #c0cfdb; }
      .mono { font: 700 16px Consolas, 'Courier New', monospace; fill: #98ebff; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1280" cy="160" r="210" fill="#2d6274" opacity="0.12"/>
  <circle cx="180" cy="780" r="250" fill="#4b2f2f" opacity="0.10"/>

  <text x="80" y="82" class="title">AXIOM Operating Model</text>
  <text x="80" y="118" class="subtitle">A stable local core, optional attached systems, and a separate experimental edge</text>

  <rect x="70" y="170" width="1460" height="130" rx="28" fill="#102030" stroke="#6fdcff" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="110" y="222" class="h">One Command, One Root Process</text>
  <text x="110" y="260" class="p">Normal entrypoint: <tspan class="mono">axiom</tspan> or <tspan class="mono">Axiom.bat</tspan></text>
  <text x="110" y="290" class="small">AXIOM boots locally first, then decides which sidecars it can safely attach.</text>

  <rect x="70" y="360" width="455" height="430" rx="30" fill="url(#coreCard)" stroke="#72ddff" stroke-width="3" filter="url(#shadow)"/>
  <text x="108" y="420" class="h">Core Runtime</text>
  <text x="108" y="460" class="p">This is the expected daily-use path.</text>
  <text x="108" y="510" class="k">Brain</text>
  <text x="108" y="540" class="p">Gemini Live runtime in <tspan class="mono">main.py</tspan></text>
  <text x="108" y="585" class="k">Execution</text>
  <text x="108" y="615" class="p"><tspan class="mono">actions/</tspan> for browser, desktop, terminal, files, prompts, research</text>
  <text x="108" y="660" class="k">Task Engine</text>
  <text x="108" y="690" class="p"><tspan class="mono">planner.py</tspan>, <tspan class="mono">executor.py</tspan>, queue, heartbeat</text>
  <text x="108" y="735" class="k">Memory Spine</text>
  <text x="108" y="765" class="p">SQLite runtime store, conversation archive, Nexus recall</text>

  <rect x="572" y="360" width="455" height="430" rx="30" fill="url(#optCard)" stroke="#a7f7a3" stroke-width="3" filter="url(#shadow)"/>
  <text x="610" y="420" class="h">Optional Sidecars</text>
  <text x="610" y="460" class="p">Useful when configured, not required for local boot.</text>
  <text x="610" y="510" class="k">Channels</text>
  <text x="610" y="540" class="p">Telegram bridge with explicit chat allow-listing</text>
  <text x="610" y="585" class="k">Attached Systems</text>
  <text x="610" y="615" class="p">MiroFish, Automaton, PersonaPlex, OpenRGB, MT5</text>
  <text x="610" y="660" class="k">Knowledge Extensions</text>
  <text x="610" y="690" class="p">External skill libraries and local <tspan class="mono">autoresearch</tspan> repo support</text>
  <text x="610" y="735" class="k">Boot Rule</text>
  <text x="610" y="765" class="p">Discover, report, and auto-start only when local config says so</text>

  <rect x="1074" y="360" width="455" height="430" rx="30" fill="url(#expCard)" stroke="#ffbf88" stroke-width="3" filter="url(#shadow)"/>
  <text x="1112" y="420" class="h">Experimental Edge</text>
  <text x="1112" y="460" class="p">Integrated, but not part of the safe default path.</text>
  <text x="1112" y="510" class="k">Browser Backend</text>
  <text x="1112" y="540" class="p">Lightpanda over CDP</text>
  <text x="1112" y="585" class="k">Why Separate It</text>
  <text x="1112" y="615" class="p">AXIOM should not lose stable browser automation because a beta backend regressed.</text>
  <text x="1112" y="660" class="k">Current Policy</text>
  <text x="1112" y="690" class="p">Default browser backend remains Playwright.</text>
  <text x="1112" y="735" class="k">Fallback</text>
  <text x="1112" y="765" class="p">If Lightpanda collapses, AXIOM should fall back instead of freezing the runtime.</text>
</svg>
