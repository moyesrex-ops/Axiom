<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Axiom Startup and Memory Flow</title>
  <desc id="desc">Flow diagram showing first launch, optional Telegram setup, live runtime start, conversation archiving, fact extraction, and future recall.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a1119"/>
      <stop offset="100%" stop-color="#152536"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#061018" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#92e0ff"/>
    </marker>
    <style>
      .title { font: 700 38px 'Segoe UI', Arial, sans-serif; fill: #f6fbff; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #b9cad8; }
      .boxh { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #f6fbff; }
      .boxp { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #d4e0ea; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #bad0dd; }
      .arrow { stroke: #92e0ff; stroke-width: 4; fill: none; marker-end: url(#arrow2); }
      .dash { stroke: #ffd580; stroke-width: 3; stroke-dasharray: 10 10; fill: none; marker-end: url(#arrow2); }
    </style>
  </defs>

  <rect width="1600" height="940" fill="url(#bg2)"/>
  <circle cx="1320" cy="200" r="220" fill="#21475a" opacity="0.11"/>
  <circle cx="240" cy="760" r="200" fill="#45355f" opacity="0.10"/>

  <text x="80" y="78" class="title">Startup, Memory, and Recall Flow</text>
  <text x="80" y="116" class="subtitle">How Axiom now boots, optionally links Telegram, stores history, and reuses context across sessions</text>

  <rect x="80" y="190" width="280" height="140" rx="24" fill="#122233" stroke="#75d9ff" stroke-width="2.5" filter="url(#shadow2)"/>
  <text x="110" y="240" class="boxh">1. Launch</text>
  <text x="110" y="274" class="boxp">Run <tspan font-family="Consolas, monospace">Axiom.bat</tspan></text>
  <text x="110" y="302" class="boxp">Load runtime config + state store</text>

  <rect x="420" y="170" width="330" height="180" rx="24" fill="#132538" stroke="#8effc3" stroke-width="2.5" filter="url(#shadow2)"/>
  <text x="450" y="220" class="boxh">2. First-Run Setup</text>
  <text x="450" y="254" class="boxp">Gemini key is required</text>
  <text x="450" y="282" class="boxp">Telegram token and chat IDs are optional</text>
  <text x="450" y="310" class="small">Skip Telegram and Axiom still boots normally</text>

  <rect x="820" y="170" width="320" height="180" rx="24" fill="#142538" stroke="#ffcc74" stroke-width="2.5" filter="url(#shadow2)"/>
  <text x="850" y="220" class="boxh">3. Runtime Start</text>
  <text x="850" y="254" class="boxp">Live voice session comes online</text>
  <text x="850" y="282" class="boxp">Telegram bridge starts only if configured</text>
  <text x="850" y="310" class="small">Optional channels never block local use</text>

  <rect x="1210" y="170" width="300" height="180" rx="24" fill="#142536" stroke="#ff9c8c" stroke-width="2.5" filter="url(#shadow2)"/>
  <text x="1240" y="220" class="boxh">4. Live Interaction</text>
  <text x="1240" y="254" class="boxp">Voice turn</text>
  <text x="1240" y="282" class="boxp">Tool call or queued task</text>
  <text x="1240" y="310" class="boxp">Axiom responds</text>

  <rect x="140" y="470" width="360" height="190" rx="24" fill="#132439" stroke="#71dfff" stroke-width="2.5" filter="url(#shadow2)"/>
  <text x="170" y="522" class="boxh">5. Conversation Archive</text>
  <text x="170" y="558" class="boxp">Every user turn and Axiom reply</text>
  <text x="170" y="586" class="boxp">is written into SQLite</text>
  <text x="170" y="614" class="small">This gives durable cross-session recall instead of only short-term context.</text>

  <rect x="590" y="470" width="420" height="190" rx="24" fill="#132439" stroke="#89ffbf" stroke-width="2.5" filter="url(#shadow2)"/>
  <text x="620" y="522" class="boxh">6. Structured Memory Extraction</text>
  <text x="620" y="558" class="boxp">Stable user facts and preferences</text>
  <text x="620" y="586" class="boxp">continue to flow into long_term.json</text>
  <text x="620" y="614" class="small">Identity, preferences, relationships, notes, and nexus knowledge stay available.</text>

  <rect x="1100" y="470" width="350" height="190" rx="24" fill="#132439" stroke="#ffc770" stroke-width="2.5" filter="url(#shadow2)"/>
  <text x="1130" y="522" class="boxh">7. Task and Runtime State</text>
  <text x="1130" y="558" class="boxp">Task checkpoints</text>
  <text x="1130" y="586" class="boxp">Failures, events, capabilities</text>
  <text x="1130" y="614" class="small">Useful for debugging, recovery, and remote Telegram status checks.</text>

  <rect x="350" y="760" width="900" height="120" rx="24" fill="#102234" stroke="#b7d8ea" stroke-width="2.5" filter="url(#shadow2)"/>
  <text x="385" y="812" class="boxh">8. Future Recall</text>
  <text x="385" y="846" class="boxp">At the next startup, Axiom injects relevant user memory, recent nexus knowledge, and archived conversation recall into its live prompt context.</text>

  <path class="arrow" d="M 360 260 C 390 260, 395 260, 420 260"/>
  <path class="arrow" d="M 750 260 C 785 260, 790 260, 820 260"/>
  <path class="arrow" d="M 1140 260 C 1175 260, 1180 260, 1210 260"/>
  <path class="arrow" d="M 1360 350 C 1360 410, 1300 430, 1275 470"/>
  <path class="arrow" d="M 1230 350 C 1100 420, 970 430, 850 470"/>
  <path class="arrow" d="M 1210 350 C 1040 430, 770 430, 660 470"/>
  <path class="arrow" d="M 1210 350 C 900 450, 480 435, 360 470"/>
  <path class="arrow" d="M 320 660 C 390 720, 520 740, 610 760"/>
  <path class="arrow" d="M 800 660 C 800 710, 800 720, 800 760"/>
  <path class="arrow" d="M 1270 660 C 1190 720, 1050 740, 940 760"/>
  <path class="dash" d="M 905 820 C 1020 820, 1160 760, 1270 660"/>

  <text x="534" y="154" class="small">optional branch</text>
  <text x="1270" y="438" class="small">state writes</text>
  <text x="1042" y="438" class="small">fact extraction</text>
  <text x="825" y="438" class="small">conversation archive</text>
  <text x="1135" y="735" class="small">search + recall loop</text>
</svg>
