<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">AXIOM Startup and Memory Flow</title>
  <desc id="desc">Startup flow showing local launch, config overlay, optional sidecars, live runtime, memory writes, and future recall.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a1219"/>
      <stop offset="100%" stop-color="#152839"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#061018" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ee7ff"/>
    </marker>
    <style>
      .title { font: 700 39px 'Segoe UI', Arial, sans-serif; fill: #f6fbff; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #bfd2df; }
      .h { font: 700 23px 'Segoe UI', Arial, sans-serif; fill: #f7fbff; }
      .p { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #d9e6ef; }
      .small { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #bfd2df; }
      .mono { font: 700 15px Consolas, 'Courier New', monospace; fill: #99ebff; }
      .line { stroke: #8ee7ff; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #ffcb88; stroke-width: 3.5; stroke-dasharray: 10 10; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="940" fill="url(#bg)"/>
  <circle cx="1280" cy="160" r="210" fill="#2d6170" opacity="0.11"/>
  <circle cx="230" cy="780" r="230" fill="#5a3427" opacity="0.10"/>

  <text x="80" y="80" class="title">Startup, Persistence, and Recall</text>
  <text x="80" y="116" class="subtitle">How AXIOM boots from one command, overlays local config, writes memory, and reuses context later</text>

  <rect x="80" y="180" width="260" height="140" rx="26" fill="#112334" stroke="#78ddff" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="110" y="230" class="h">1. Launch</text>
  <text x="110" y="265" class="p"><tspan class="mono">axiom</tspan> or <tspan class="mono">Axiom.bat</tspan></text>
  <text x="110" y="294" class="small">single local entrypoint</text>

  <rect x="400" y="160" width="340" height="180" rx="26" fill="#132639" stroke="#8ee9be" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="432" y="214" class="h">2. Config Overlay</text>
  <text x="432" y="248" class="p"><tspan class="mono">runtime.json</tspan> shared defaults</text>
  <text x="432" y="278" class="p"><tspan class="mono">runtime.local.json</tspan> machine overrides</text>
  <text x="432" y="308" class="small">later local writes prefer the ignored local file</text>

  <rect x="800" y="160" width="340" height="180" rx="26" fill="#142638" stroke="#ffd08a" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="832" y="214" class="h">3. Secrets and Setup</text>
  <text x="832" y="248" class="p"><tspan class="mono">api_keys.json</tspan> or env vars</text>
  <text x="832" y="278" class="p">Gemini required, Telegram optional</text>
  <text x="832" y="308" class="small">missing Telegram should not block local use</text>

  <rect x="1200" y="160" width="320" height="180" rx="26" fill="#142536" stroke="#ffac9b" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1232" y="214" class="h">4. Boot Integrations</text>
  <text x="1232" y="248" class="p">start only enabled sidecars</text>
  <text x="1232" y="278" class="p">report what is reachable</text>
  <text x="1232" y="308" class="small">local boot still succeeds without them</text>

  <rect x="160" y="450" width="360" height="190" rx="28" fill="#122435" stroke="#74deff" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="192" y="504" class="h">5. Live Runtime</text>
  <text x="192" y="540" class="p">Gemini Live conversation</text>
  <text x="192" y="570" class="p">tool calls, tasks, replies</text>
  <text x="192" y="600" class="p">capability-aware prompt context</text>

  <rect x="620" y="450" width="360" height="190" rx="28" fill="#122435" stroke="#98f0a2" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="652" y="504" class="h">6. Persistent Writes</text>
  <text x="652" y="540" class="p">conversation archive</text>
  <text x="652" y="570" class="p">runtime events and failures</text>
  <text x="652" y="600" class="p">task checkpoints and capability snapshots</text>

  <rect x="1080" y="450" width="360" height="190" rx="28" fill="#122435" stroke="#ffc482" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1112" y="504" class="h">7. Long-Term Memory</text>
  <text x="1112" y="540" class="p">stable facts and preferences</text>
  <text x="1112" y="570" class="p">Nexus knowledge and topic recall</text>
  <text x="1112" y="600" class="p">searchable context across sessions</text>

  <rect x="350" y="760" width="900" height="110" rx="28" fill="#102132" stroke="#b8d1df" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="386" y="808" class="h">8. Future Recall</text>
  <text x="386" y="842" class="p">At the next startup, AXIOM can pull archived conversation, structured memory, and recent runtime state back into context.</text>

  <path class="line" d="M 340 250 C 366 250, 372 250, 400 250"/>
  <path class="line" d="M 740 250 C 766 250, 772 250, 800 250"/>
  <path class="line" d="M 1140 250 C 1166 250, 1172 250, 1200 250"/>
  <path class="line" d="M 1260 340 C 1240 390, 1180 415, 1140 450"/>
  <path class="line" d="M 1200 340 C 1040 420, 900 425, 800 450"/>
  <path class="line" d="M 1180 340 C 900 440, 560 435, 340 450"/>
  <path class="line" d="M 340 640 C 430 714, 560 740, 660 760"/>
  <path class="line" d="M 800 640 C 800 700, 800 718, 800 760"/>
  <path class="line" d="M 1260 640 C 1160 714, 1030 740, 940 760"/>
  <path class="dash" d="M 1040 815 C 1180 810, 1260 710, 1260 640"/>

  <text x="1244" y="424" class="small">status + attach</text>
  <text x="920" y="424" class="small">runtime start</text>
  <text x="516" y="424" class="small">normal local boot</text>
  <text x="1160" y="734" class="small">search / recall loop</text>
</svg>
