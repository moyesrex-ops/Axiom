<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Axiom System Architecture</title>
  <desc id="desc">Architecture diagram showing user inputs, Axiom live runtime, task orchestration, tool layer, memory and state, and external systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#09111d"/>
      <stop offset="100%" stop-color="#14263b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#13263a"/>
      <stop offset="100%" stop-color="#102030"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#021018" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7edcff"/>
    </marker>
    <style>
      .title { font: 700 40px 'Segoe UI', Arial, sans-serif; fill: #f3f7fb; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #b9cad8; }
      .h { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #f6fbff; }
      .p { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #d0deea; }
      .mono { font: 600 15px Consolas, 'Courier New', monospace; fill: #8fe3ff; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #b8c7d5; }
      .line { stroke: #7edcff; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dimline { stroke: #4aa6cf; stroke-width: 3; fill: none; marker-end: url(#arrow); opacity: 0.9; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <circle cx="1280" cy="140" r="180" fill="#1d4f62" opacity="0.14"/>
  <circle cx="180" cy="820" r="220" fill="#29445b" opacity="0.12"/>

  <text x="80" y="80" class="title">A.X.I.O.M Runtime Architecture</text>
  <text x="80" y="118" class="subtitle">Live voice shell, autonomous task engine, persistent memory, and optional external channels</text>

  <rect x="70" y="190" width="290" height="180" rx="24" fill="#112232" stroke="#55d0ff" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="100" y="238" class="h">User Surface</text>
  <text x="100" y="278" class="p">Voice conversation</text>
  <text x="100" y="308" class="p">Desktop HUD</text>
  <text x="100" y="338" class="p">Optional Telegram bot</text>

  <rect x="430" y="150" width="420" height="250" rx="26" fill="url(#card)" stroke="#7edcff" stroke-width="3" filter="url(#shadow)"/>
  <text x="465" y="205" class="h">Live Runtime</text>
  <text x="465" y="242" class="mono">main.py</text>
  <text x="465" y="278" class="p">Gemini Live session</text>
  <text x="465" y="308" class="p">Audio send / receive loop</text>
  <text x="465" y="338" class="p">Function-call router</text>
  <text x="465" y="368" class="p">Capability-aware system prompt</text>

  <rect x="930" y="150" width="570" height="250" rx="26" fill="url(#card)" stroke="#89ffcb" stroke-width="3" filter="url(#shadow)"/>
  <text x="965" y="205" class="h">Action Layer</text>
  <text x="965" y="242" class="mono">actions/</text>
  <text x="965" y="278" class="p">Browser + screen + desktop + terminal</text>
  <text x="965" y="308" class="p">Prompt Studio + lead research + swarm orchestration</text>
  <text x="965" y="338" class="p">Trading + RGB hardware + file/code helpers</text>
  <text x="965" y="368" class="p">System capability inspection + optional Persona/Telegram controls</text>

  <rect x="430" y="470" width="420" height="220" rx="26" fill="url(#card)" stroke="#ffc66d" stroke-width="3" filter="url(#shadow)"/>
  <text x="465" y="525" class="h">Task Orchestration</text>
  <text x="465" y="562" class="mono">agent/</text>
  <text x="465" y="598" class="p">planner.py</text>
  <text x="465" y="626" class="p">executor.py</text>
  <text x="465" y="654" class="p">task_queue.py + heartbeat.py</text>

  <rect x="930" y="470" width="570" height="220" rx="26" fill="url(#card)" stroke="#ff9b77" stroke-width="3" filter="url(#shadow)"/>
  <text x="965" y="525" class="h">Memory and State</text>
  <text x="965" y="562" class="mono">memory/ + runtime_store.py</text>
  <text x="965" y="598" class="p">long_term.json for user facts + nexus knowledge</text>
  <text x="965" y="626" class="p">axiom_state.db for events, failures, task checkpoints</text>
  <text x="965" y="654" class="p">conversation archive with searchable cross-session recall</text>

  <rect x="70" y="760" width="1430" height="150" rx="26" fill="#0f1e2d" stroke="#718da4" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="110" y="814" class="h">External Systems and Optional Integrations</text>
  <text x="110" y="852" class="p">Gemini Live API • Playwright • OpenRGB • MetaTrader 5 • CCXT • Telegram Bot API • Optional PersonaPlex / MiroFish / Automaton paths</text>
  <text x="110" y="882" class="small">Axiom stays locally runnable even when optional integrations are disabled.</text>

  <path class="line" d="M 360 280 C 385 280, 392 275, 430 275"/>
  <path class="line" d="M 850 275 C 885 275, 890 275, 930 275"/>
  <path class="dimline" d="M 640 400 C 640 430, 640 440, 640 470"/>
  <path class="dimline" d="M 1040 400 C 1040 440, 1040 445, 1040 470"/>
  <path class="dimline" d="M 850 580 C 885 580, 890 580, 930 580"/>
  <path class="dimline" d="M 640 690 C 640 725, 640 735, 640 760"/>
  <path class="dimline" d="M 1210 690 C 1210 725, 1210 735, 1210 760"/>
  <path class="dimline" d="M 250 370 C 250 550, 250 550, 430 580"/>

  <text x="102" y="407" class="small">Telegram remains optional and does not block local startup.</text>
  <text x="884" y="436" class="small">Tool calls</text>
  <text x="662" y="445" class="small">task escalation</text>
  <text x="1080" y="438" class="small">persistent writes</text>
</svg>
