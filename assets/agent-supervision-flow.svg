  <rect x="180" y="378" width="522" height="104" rx="18" fill="#102236" stroke="#37628F" stroke-width="2"/>
  <text x="212" y="420" fill="#F2FAFF" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">
