  </text>

  <rect x="860" y="302" width="250" height="166" rx="18" fill="#132640" stroke="#4C7AAF" stroke-width="2"/>
  <text x="886" y="344" fill="#F2FAFF" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">
