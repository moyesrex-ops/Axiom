<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">AXIOM Live Runtime Resilience</title>
  <desc id="desc">Diagram showing adaptive voice input, Telegram chat routing, system context, memory archive, and reconnect recovery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#090b18"/>
      <stop offset="100%" stop-color="#140f28"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#151a33"/>
      <stop offset="100%" stop-color="#0f1327"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#73f0ff"/>
      <stop offset="100%" stop-color="#8f66ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="780" fill="url(#bg)"/>
  <circle cx="1180" cy="110" r="200" fill="#22194a" opacity="0.35"/>
  <circle cx="180" cy="620" r="220" fill="#102446" opacity="0.28"/>

  <text x="80" y="82" fill="#eef3ff" font-size="38" font-family="Segoe UI, Arial, sans-serif" font-weight="700">
    AXIOM Live Runtime: Voice, Context, and Recovery
  </text>
  <text x="80" y="118" fill="#9db2da" font-size="20" font-family="Segoe UI, Arial, sans-serif">
    The live layer now routes chat naturally, hears softer/accented speech more clearly, and recovers context after reconnects.
  </text>

  <rect x="78" y="170" rx="28" ry="28" width="290" height="190" fill="url(#card)" stroke="#3151a8" stroke-width="2"/>
  <text x="108" y="214" fill="#73f0ff" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Voice Input</text>
  <text x="108" y="252" fill="#e8ecff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Adaptive gain lifts quieter speech</text>
  <text x="108" y="284" fill="#e8ecff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Dynamic interruption threshold</text>
  <text x="108" y="316" fill="#e8ecff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Speaker echo guard after playback</text>

  <rect x="418" y="142" rx="32" ry="32" width="560" height="252" fill="url(#card)" stroke="#8f66ff" stroke-width="2.5"/>
  <rect x="454" y="186" rx="18" ry="18" width="486" height="54" fill="#101938" stroke="#2f4fa2" stroke-width="1.5"/>
  <text x="486" y="220" fill="#eef3ff" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Gemini Live Core</text>
  <text x="486" y="273" fill="#dfe7ff" font-size="19" font-family="Segoe UI, Arial, sans-serif">Prompt = personality + system context + memory recall + capability state</text>
  <text x="486" y="307" fill="#dfe7ff" font-size="19" font-family="Segoe UI, Arial, sans-serif">Maintains tool access without flattening tone</text>
  <text x="486" y="341" fill="#dfe7ff" font-size="19" font-family="Segoe UI, Arial, sans-serif">Recovers partial turns when the live link drops</text>

  <rect x="1024" y="170" rx="28" ry="28" width="300" height="190" fill="url(#card)" stroke="#3151a8" stroke-width="2"/>
  <text x="1054" y="214" fill="#73f0ff" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Telegram Bridge</text>
  <text x="1054" y="252" fill="#e8ecff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Plain chat gets a direct reply</text>
  <text x="1054" y="284" fill="#e8ecff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Operational requests can queue tasks</text>
  <text x="1054" y="316" fill="#e8ecff" font-size="18" font-family="Segoe UI, Arial, sans-serif">/task remains the explicit long-job path</text>

  <rect x="120" y="470" rx="28" ry="28" width="300" height="188" fill="url(#card)" stroke="#3151a8" stroke-width="2"/>
  <text x="150" y="514" fill="#73f0ff" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700">System Context</text>
  <text x="150" y="552" fill="#e8ecff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Timezone, locale, and best-effort location</text>
  <text x="150" y="584" fill="#e8ecff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Used for reminders, dates, seasons, and status</text>
  <text x="150" y="616" fill="#e8ecff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Exposed through system_capabilities context</text>

  <rect x="550" y="470" rx="28" ry="28" width="300" height="188" fill="url(#card)" stroke="#3151a8" stroke-width="2"/>
  <text x="580" y="514" fill="#73f0ff" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Memory Archive</text>
  <text x="580" y="552" fill="#e8ecff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Conversation turns persisted to SQLite</text>
  <text x="580" y="584" fill="#e8ecff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Structured long-term Nexus recall</text>
  <text x="580" y="616" fill="#e8ecff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Searchable across sessions and channels</text>

  <rect x="980" y="470" rx="28" ry="28" width="300" height="188" fill="url(#card)" stroke="#3151a8" stroke-width="2"/>
  <text x="1010" y="514" fill="#73f0ff" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Recovery Loop</text>
  <text x="1010" y="552" fill="#e8ecff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Connection errors logged to runtime events</text>
  <text x="1010" y="584" fill="#e8ecff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Partial transcript survives reconnects</text>
  <text x="1010" y="616" fill="#e8ecff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Restores context before resuming speech</text>

  <path d="M368 265 C392 265 398 265 418 265" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M978 265 C998 265 1004 265 1024 265" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M270 470 C310 400 380 358 492 330" fill="none" stroke="#5ec8ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M700 470 C700 432 700 416 700 394" fill="none" stroke="#8f66ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M1130 470 C1094 404 1028 360 908 330" fill="none" stroke="#5ec8ff" stroke-width="4" stroke-linecap="round"/>

  <circle cx="700" cy="520" r="6" fill="#9be4ff"/>
  <circle cx="270" cy="470" r="6" fill="#9be4ff"/>
  <circle cx="1130" cy="470" r="6" fill="#9be4ff"/>
</svg>
