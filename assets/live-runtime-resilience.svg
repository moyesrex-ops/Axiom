<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">AXIOM Live Runtime Resilience</title>
  <desc id="desc">Diagram showing voice capture, live core, Telegram behavior, memory context, and reconnect recovery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0a121b"/>
      <stop offset="100%" stop-color="#17283a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#051018" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fe8ff"/>
    </marker>
    <style>
      .title { font: 700 39px 'Segoe UI', Arial, sans-serif; fill: #f7fbff; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #bfd3e0; }
      .h { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #f7fbff; }
      .p { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #d8e6ef; }
      .small { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #bfd3e0; }
      .line { stroke: #8fe8ff; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1500" height="820" fill="url(#bg)"/>
  <circle cx="1240" cy="140" r="220" fill="#2c5d6d" opacity="0.12"/>
  <circle cx="180" cy="680" r="240" fill="#52382b" opacity="0.10"/>

  <text x="80" y="82" class="title">Live Runtime Behavior and Recovery</text>
  <text x="80" y="118" class="subtitle">The live layer should hear better, respond more naturally, and recover without losing its place</text>

  <rect x="90" y="190" width="300" height="200" rx="28" fill="#122536" stroke="#73dfff" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="124" y="246" class="h">Voice Capture</text>
  <text x="124" y="284" class="p">adaptive input gain</text>
  <text x="124" y="314" class="p">better handling of softer or accented speech</text>
  <text x="124" y="344" class="p">speaker-echo guard after playback</text>

  <rect x="470" y="150" width="560" height="280" rx="32" fill="#152b3f" stroke="#8ee3ff" stroke-width="3" filter="url(#shadow)"/>
  <text x="510" y="214" class="h">Gemini Live Core</text>
  <text x="510" y="256" class="p">personality prompt + capability context + memory recall</text>
  <text x="510" y="288" class="p">tool-call routing without flattening the runtime into a passive shell</text>
  <text x="510" y="320" class="p">partial-turn recovery when the live link drops</text>
  <text x="510" y="352" class="p">clean shutdown and reconnect behavior</text>

  <rect x="1110" y="190" width="300" height="200" rx="28" fill="#132536" stroke="#a7f0a0" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1144" y="246" class="h">Telegram Bridge</text>
  <text x="1144" y="284" class="p">plain chat gets direct replies</text>
  <text x="1144" y="314" class="p">allowed chats can queue tasks</text>
  <text x="1144" y="344" class="p">execution remains gated, not implicit</text>

  <rect x="140" y="510" width="340" height="180" rx="28" fill="#122536" stroke="#76deff" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="176" y="562" class="h">System Context</text>
  <text x="176" y="598" class="p">timezone, locale, and local hints</text>
  <text x="176" y="628" class="p">public IP lookup stays opt-in</text>

  <rect x="580" y="510" width="340" height="180" rx="28" fill="#132537" stroke="#ffd08b" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="616" y="562" class="h">Memory Context</text>
  <text x="616" y="598" class="p">conversation archive</text>
  <text x="616" y="628" class="p">long-term memory and Nexus recall</text>

  <rect x="1020" y="510" width="340" height="180" rx="28" fill="#132537" stroke="#ffb795" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1056" y="562" class="h">Recovery Loop</text>
  <text x="1056" y="598" class="p">connection errors logged</text>
  <text x="1056" y="628" class="p">recent context restored before resuming</text>

  <path class="line" d="M 390 290 C 418 290, 428 290, 470 290"/>
  <path class="line" d="M 1030 290 C 1060 290, 1070 290, 1110 290"/>
  <path class="line" d="M 330 510 C 390 438, 470 392, 570 365"/>
  <path class="line" d="M 750 430 C 750 462, 750 474, 750 510"/>
  <path class="line" d="M 1160 510 C 1100 438, 1020 392, 920 365"/>

  <text x="428" y="272" class="small">live speech</text>
  <text x="1050" y="272" class="small">chat path</text>
  <text x="424" y="456" class="small">context feed</text>
  <text x="772" y="474" class="small">recall</text>
  <text x="1090" y="456" class="small">reconnect state</text>
</svg>
